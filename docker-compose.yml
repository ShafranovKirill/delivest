version: "3.8"

services:
  del_all:
    image: ghcr.io/kirillshafranov/delivest:latest
    container_name: delivest_all
    restart: always
    env_file:
      - .env
    environment:
      - SERVER_ROLE=all
    ports:
      - "127.0.0.1:${WEB_PORT_EXTERNAL:-4000}:4000"
    depends_on:
      - postgres
      - minio
    networks:
      - delivest-network

  postgres:
    image: postgres:16-alpine
    container_name: delivest_prod_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - delivest-network

  minio:
    image: minio/minio
    container_name: delivest_prod_minio
    restart: always
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    volumes:
      - minio_prod_data:/data
    ports:
      - "127.0.0.1:${MINIO_PORT_EXTERNAL:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT_EXTERNAL:-9001}:9001"
    networks:
      - delivest-network

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    env_file:
      - .env
    networks:
      - delivest-network
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc alias set myminio http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD); do echo 'Waiting for MinIO...'; sleep 1; done;
      /usr/bin/mc mb myminio/$$MINIO_BUCKET || true;
      /usr/bin/mc anonymous set public myminio/$$MINIO_BUCKET;
      exit 0;
      "

networks:
  delivest-network:
    driver: bridge

volumes:
  postgres_prod_data:
  minio_prod_data:
