services:
  gateway:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}_gateway
    restart: always
    environment:
      - PHX_HOST=${PHX_HOST}
      - S3_PUBLIC_HOST=${S3_PUBLIC_HOST}
      - S3_BUCKET=${S3_BUCKET:-delivest}
      - S3_PORT=${S3_PORT:-8333}
    volumes:
      - ./deploy/nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    depends_on:
      - server
      - client
      - s3
    networks:
      - delivest-network

  server:
    image: ${DELIVEST_SERVER_IMAGE:-ghcr.io/shafranovkirill/delivest-server:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}_server
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=ecto://${DB_USER}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME}
      - INSTANCE_BACKUP_DIR=/instance-backups
      - DELIVEST_PUBLIC_CONFIG_PATH=/app/state/public-site.json
    volumes:
      - instance_backups:/instance-backups
      - public_site_state:/app/state
    depends_on:
      - postgres
      - s3
    networks:
      - delivest-network

  client:
    image: ${DELIVEST_CLIENT_IMAGE:-ghcr.io/shafranovkirill/delivest-client:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}_client
    restart: always
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
    networks:
      - delivest-network

  postgres:
    image: postgres:16-alpine@sha256:0cefaabd882e42bcb2a2f3dc56d3ce4770560ba62fd7f197f1a2e008fd5731ab
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}_prod_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - delivest-network

  s3:
    image: chrislusf/seaweedfs:4.50@sha256:c2658820e763294a9e9de7b36c81e59b879e3459148351aee4e31a126ca64860
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}-s3
    restart: always
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities": [
          {"name": "delivest",
           "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
           "actions": ["Admin", "Read", "List", "Tagging", "Write"]},
          {"name": "anonymous", "actions": ["Read:$$S3_BUCKET"]}
        ]}
        JSON
        exec weed server -s3 -s3.port=$$S3_PORT -s3.config=/etc/seaweedfs/s3.json -dir=/data
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-delivest}
      - S3_PORT=${S3_PORT:-8333}
    volumes:
      - s3_data:/data
    networks:
      - delivest-network

networks:
  delivest-network:
    driver: bridge

volumes:
  postgres_prod_data:
  s3_data:
  instance_backups:
  public_site_state:
