services:
  gateway:
    image: nginx:1.28-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}_gateway
    restart: always
    environment:
      - PHX_HOST=${PHX_HOST}
      - S3_PUBLIC_HOST=${S3_PUBLIC_HOST}
      - S3_BUCKET=${S3_BUCKET:-delivest}
      - S3_PORT=${S3_PORT:-8333}
    volumes:
      - ./deploy/nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "127.0.0.1:${GATEWAY_PORT:-8080}:80"
    depends_on:
      - server
      - client
      - s3
    networks:
      - delivest-network

  server:
    image: ghcr.io/shafranovkirill/delivest-server:latest
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}_server
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=ecto://${DB_USER}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME}
    depends_on:
      - postgres
      - s3
    networks:
      - delivest-network

  client:
    image: ghcr.io/shafranovkirill/delivest-client:latest
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}_client
    restart: always
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL}
      - VITE_YANDEX_MAPS_API_KEY=${VITE_YANDEX_MAPS_API_KEY}
    networks:
      - delivest-network

  postgres:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}_prod_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - delivest-network

  s3:
    image: chrislusf/seaweedfs
    container_name: ${COMPOSE_PROJECT_NAME:-delivest}-s3
    restart: always
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /etc/seaweedfs
        cat > /etc/seaweedfs/s3.json <<JSON
        {"identities": [
          {"name": "delivest",
           "credentials": [{"accessKey": "$$S3_ACCESS_KEY", "secretKey": "$$S3_SECRET_KEY"}],
           "actions": ["Admin", "Read", "List", "Tagging", "Write"]},
          {"name": "anonymous", "actions": ["Read:$$S3_BUCKET"]}
        ]}
        JSON
        exec weed server -s3 -s3.port=$$S3_PORT -s3.config=/etc/seaweedfs/s3.json -dir=/data
    environment:
      - S3_ACCESS_KEY=${S3_ACCESS_KEY}
      - S3_SECRET_KEY=${S3_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET:-delivest}
      - S3_PORT=${S3_PORT:-8333}
    volumes:
      - s3_data:/data
    networks:
      - delivest-network

networks:
  delivest-network:
    driver: bridge

volumes:
  postgres_prod_data:
  s3_data:
