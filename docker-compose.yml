version: "3.8"

services:
  del_all:
    image: ghcr.io/shafranovkirill/delivest-server:latest
    container_name: delivest_server
    restart: always
    env_file:
      - .env
    environment:
      - DATABASE_URL=ecto://${DB_USER}:${DB_PASSWORD}@${DB_HOST}/${DB_NAME}
    ports:
      - "127.0.0.1:${WEB_PORT_EXTERNAL:-4000}:4000"
    depends_on:
      - postgres
      - s3
      - filer
    networks:
      - delivest-network

  client:
    image: ghcr.io/shafranovkirill/delivest-client:latest
    container_name: delivest_client
    restart: always
    ports:
      - "127.0.0.1:${VITE_PORT_WEB:-3000}:3000"
    networks:
      - delivest-network

  postgres:
    image: postgres:16-alpine
    container_name: delivest_prod_postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "127.0.0.1:${POSTGRES_PORT_EXTERNAL:-5432}:5432"
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    networks:
      - delivest-network

  s3:
    image: chrislusf/seaweedfs
    container_name: delivest-s3
    restart: always
    command: "server -s3 -s3.port=${S3_PORT:-8333} -dir=/data"
    ports:
      - "${S3_PORT_EXTERNAL:-8333}:${S3_PORT:-8333}"
      - "${S3_CONSOLE_PORT_EXTERNAL:-9333}:9333"
    environment:
      - S3_USER=${S3_USER}
      - S3_PASSWORD=${S3_PASSWORD}
    volumes:
      - s3_data:/data
    networks:
      - delivest-network

  filer:
    image: chrislusf/seaweedfs
    container_name: delivest-filer
    restart: always
    command: "filer -master=${S3_HOST:-s3}:9333"
    ports:
      - "8888:8888"
    depends_on:
      - s3
    networks:
      - delivest-network

networks:
  delivest-network:
    driver: bridge

volumes:
  postgres_prod_data:
  s3_data:
