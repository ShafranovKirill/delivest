services:
  gateway:
    container_name: !reset null
    ports: !override []
  server:
    container_name: !reset null
    image: ${SERVER_IMAGE:?}
    env_file: !override []
    environment: !override
      PHX_SERVER: "true"
      PHX_HOST: api.smoke.local
      SECRET_KEY_BASE: ${SMOKE_SECRET:?}
      CLIENT_ORIGIN: http://shop.smoke.local
      DATABASE_URL: ecto://smoke:smoke@postgres/smoke
      S3_ACCESS_KEY: smoke
      S3_SECRET_KEY: smoke-secret
      S3_HOST: s3
      S3_PUBLIC_HOST: s3.smoke.local
      S3_SCHEME: http://
      S3_PORT: "8333"
    volumes: !override []
    restart: "no"
  client:
    container_name: !reset null
    image: ${CLIENT_IMAGE:?}
    environment: !override
      VITE_API_BASE_URL: http://api.smoke.local
    restart: "no"
  postgres:
    container_name: !reset null
    env_file: !override []
    environment: !override
      POSTGRES_USER: smoke
      POSTGRES_PASSWORD: smoke
      POSTGRES_DB: smoke
    volumes: !override
      - database:/var/lib/postgresql/data
  s3:
    container_name: !reset null
    environment: !override
      S3_ACCESS_KEY: smoke
      S3_SECRET_KEY: smoke-secret
      S3_BUCKET: delivest
      S3_PORT: "8333"
    volumes: !override
      - storage:/data
volumes:
  database:
  storage:
