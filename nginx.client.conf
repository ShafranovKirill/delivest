resolver 127.0.0.11 valid=10s ipv6=off;

log_format delivest_client_safe '$remote_addr - $remote_user [$time_local] '
                               '"$request_method $uri $server_protocol" $status $body_bytes_sent';
error_log /var/log/nginx/error.log crit;

server {
    listen 3000;
    access_log /var/log/nginx/access.log delivest_client_safe;
    root /usr/share/nginx/html;

    set $seo_upstream http://server:4000;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location = /env-config.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /__seo/head {
        internal;
        proxy_pass $seo_upstream/seo/head;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Accept-Encoding "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 2s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @seo_empty;
    }

    location = /__seo/content {
        internal;
        proxy_pass $seo_upstream/seo/content;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header Accept-Encoding "";
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        proxy_intercept_errors on;
        error_page 404 500 502 503 504 = @seo_empty;
    }

    location = /__seo/landing-status {
        internal;
        proxy_pass $seo_upstream/seo/landing-status;
        proxy_set_header X-Original-URI $request_uri;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }

    location ~ ^/[^/]+/(product|category)/[^/]+/?$ {
        auth_request /__seo/landing-status;
        error_page 403 =404 @landing_missing;
        ssi on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    location @landing_missing {
        ssi on;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /index.html =404;
    }

    location ~ ^/catalog/([^/]+)\.xml$ {
        proxy_pass $seo_upstream/seo/branches/$1/catalog.xml;
        proxy_connect_timeout 1s;
        proxy_read_timeout 30s;
    }

    location @seo_empty {
        return 204;
    }

    location ^~ /sitemaps/ {
        proxy_pass $seo_upstream/seo$request_uri;
        proxy_connect_timeout 1s;
        proxy_read_timeout 10s;
    }

    location ~ ^/(robots\.txt|sitemap\.xml|site\.webmanifest|favicon\.ico)$ {
        proxy_pass $seo_upstream/seo/$1;
        proxy_connect_timeout 1s;
        proxy_read_timeout 5s;
    }

    location / {
        ssi on;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }
}
