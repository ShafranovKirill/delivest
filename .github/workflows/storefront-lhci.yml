name: Storefront Lighthouse (report only)

on:
  workflow_dispatch:
  pull_request:
    branches: [develop]
    paths:
      - '.github/workflows/storefront-lhci.yml'
      - 'scripts/storefront-measure.mjs'
      - 'e2e/fixtures/menu-performance/**'
      - 'e2e/tests/menu-performance.spec.ts'
      - 'server'
      - 'client'

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: '1'
      DEV_DATABASE: delivest_e2e
    services:
      db:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5-otp-28'
          otp-version: '28.4.2'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Prepare seeded fixture
        working-directory: server
        run: |
          mix deps.get
          mix compile
          npm ci --prefix assets
          mix ecto.create
          mix ecto.migrate
          MENU_PERFORMANCE_PHOTO_FIXTURE=1 mix run priv/repo/e2e_seeds.exs
          mix assets.build
      - name: Build storefront and install Chromium
        run: |
          pnpm --dir client install --frozen-lockfile
          VITE_PORT_WEB=3100 VITE_API_BASE_URL=http://localhost:4100 pnpm --dir client build
          pnpm --dir e2e install --frozen-lockfile
          pnpm --dir e2e exec playwright install --with-deps chromium
      - name: Serve seeded storefront
        run: |
          mkdir -p artifacts/lighthouse
          cp e2e/fixtures/menu-performance/* server/priv/static/images/
          (cd server && DEV_S3_PORT=4100 PORT=4100 CLIENT_ORIGIN=http://localhost:3100 DEFAULT_LOCALE=ru ATOL_HOST=http://localhost:4100/dev/atol/possystem/v5/ mix phx.server) > artifacts/lighthouse/server.log 2>&1 &
          (cd client && VITE_PORT_WEB=3100 VITE_API_BASE_URL=http://localhost:4100 pnpm exec vite preview --port 3100 --strictPort) > artifacts/lighthouse/client.log 2>&1 &
          for i in $(seq 1 120); do
            if curl -fsS http://localhost:4100/staff/auth/login >/dev/null && curl -fsS http://localhost:3100/e2e >/dev/null; then exit 0; fi
            sleep 2
          done
          exit 1
      - name: Verify local responsive photo fixture
        run: |
          for width in 192 384 800; do
            curl -fsS "http://localhost:4100/images/menu-performance-${width}.webp" -o "artifacts/lighthouse/photo-${width}.webp"
          done
          curl -fsS 'http://localhost:4100/client/storefront/v1/bootstrap?slug=e2e&locale=ru' \
            | node -e "let data=''; process.stdin.on('data', c => data += c); process.stdin.on('end', () => { const menu = JSON.parse(data).menu; if (!menu.some(c => c.products?.some(p => p.photo_variants?.length === 3))) process.exit(1) })"
      - name: Lighthouse CI collect and save report
        run: |
          export CHROME_PATH="$(cd e2e && node -e "console.log(require('@playwright/test').chromium.executablePath())")"
          npm exec --yes --package=@lhci/cli@0.15.1 -- lhci collect --url=http://localhost:3100/e2e --numberOfRuns=3 --settings.chromeFlags='--no-sandbox --headless'
          npm exec --yes --package=@lhci/cli@0.15.1 -- lhci upload --target=filesystem --outputDir=artifacts/lighthouse/report
          cp -r .lighthouseci artifacts/lighthouse/raw
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: storefront-lighthouse
          path: artifacts/lighthouse
          retention-days: 14
