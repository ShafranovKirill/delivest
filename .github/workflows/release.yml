name: Release
on:
  push:
    branches: [main]
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/checks.yml
  e2e:
    uses: ./.github/workflows/e2e.yml
  prepare:
    needs: [checks, e2e]
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      minor: ${{ steps.version.outputs.minor }}
      repository: ${{ steps.repository.outputs.value }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - id: version
        run: ./scripts/next-version.sh >> "$GITHUB_OUTPUT"
      - id: repository
        run: echo "value=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
  build:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - {variant: server, file: Dockerfile.server}
          - {variant: client, file: Dockerfile.client}
          - {variant: agent, file: Dockerfile.agent}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64
          push: true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}
          tags: ghcr.io/${{ needs.prepare.outputs.repository }}-${{ matrix.variant }}:candidate-${{ github.sha }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            APP_VERSION=${{ needs.prepare.outputs.version }}
      - name: Record digest
        env:
          VARIANT: ${{ matrix.variant }}
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test -n "$DIGEST"
          printf '%s %s\n' "$VARIANT" "$DIGEST" > "$VARIANT.digest"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}
          path: ${{ matrix.variant }}.digest
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify candidate images and write manifest
        env:
          REPOSITORY: ${{ needs.prepare.outputs.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: ./scripts/release-images.sh verify
      - name: Publish version aliases from verified digests
        env:
          REPOSITORY: ${{ needs.prepare.outputs.repository }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.prepare.outputs.version }}
          MINOR: ${{ needs.prepare.outputs.minor }}
        run: ./scripts/release-images.sh alias
      - name: Tag and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          ./scripts/release-notes.sh > notes.md
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git tag "v$VERSION"
            git push origin "v$VERSION"
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" release-manifest.json --clobber
          else
            gh release create "v$VERSION" --title "v$VERSION" --notes-file notes.md release-manifest.json
          fi
