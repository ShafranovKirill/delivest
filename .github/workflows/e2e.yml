name: E2E

on:
  push:
    branches: ["develop"]
  pull_request:
    branches: ["main", "develop"]
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    name: Spec coverage
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - name: Install Playwright package
        working-directory: e2e
        run: pnpm install --frozen-lockfile

      - name: Typecheck and verify spec collection
        working-directory: e2e
        run: |
          pnpm typecheck
          node scripts/spec-groups.mjs verify-collection

      - name: Export verified matrix
        id: groups
        working-directory: e2e
        run: |
          matrix=$(node scripts/spec-groups.mjs matrix)
          printf 'matrix=%s\n' "$matrix" >> "$GITHUB_OUTPUT"

  e2e:
    name: Playwright / ${{ matrix.group }}
    needs: coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.coverage.outputs.matrix) }}
    env:
      CI: "1"
      DEV_DATABASE: delivest_e2e
      MENU_PERFORMANCE_PHOTO_FIXTURE: ${{ matrix.group == 'storefront-account' && '1' || '0' }}
      DEV_S3_PORT: ${{ matrix.group == 'storefront-account' && '4100' || '8333' }}
    services:
      db:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5-otp-28"
          otp-version: "28.4.2"

      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2

      - uses: actions/cache@v4
        with:
          path: |
            server/deps
            server/_build/dev
          key: ${{ runner.os }}-e2e-mix-${{ hashFiles('server/mix.lock') }}

      - name: Server
        working-directory: server
        run: |
          mix deps.get
          mix compile
          npm ci --prefix assets
          mix ecto.create
          mix ecto.migrate
          mix run priv/repo/e2e_seeds.exs
          if [[ "$MENU_PERFORMANCE_PHOTO_FIXTURE" == "1" ]]; then
            cp ../e2e/fixtures/menu-performance/* priv/static/images/
          fi

      - name: Client
        working-directory: client
        run: pnpm install --frozen-lockfile

      - name: Playwright
        working-directory: e2e
        env:
          GROUP: ${{ matrix.group }}
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium
          if [[ "$GROUP" == "storefront-account" ]]; then
            mkdir -p ../artifacts/menu-performance ../artifacts/menu-background
          fi
          node scripts/spec-groups.mjs run "$GROUP" --workers=1

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-${{ matrix.group }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  playwright:
    name: Playwright
    needs: [coverage, e2e]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Reject cancelled workflow
        if: cancelled()
        run: exit 1

      - name: Verify all groups passed
        if: always()
        env:
          COVERAGE_RESULT: ${{ needs.coverage.result }}
          MATRIX_RESULT: ${{ needs.e2e.result }}
        run: |
          if [[ "$COVERAGE_RESULT" != "success" || "$MATRIX_RESULT" != "success" ]]; then
            echo "Spec coverage: $COVERAGE_RESULT; Playwright matrix: $MATRIX_RESULT"
            exit 1
          fi
