name: Checks
on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:
  workflow_call:
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  server:
    runs-on: ubuntu-24.04
    services:
      db:
        image: postgres:16-alpine
        ports: ['5432:5432']
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5-otp-28'
          otp-version: '28.4.2'
      - run: mix deps.get
        working-directory: server
      - name: Cache dialyzer PLT
        uses: actions/cache@v4
        with:
          path: |
            server/_build/test/*.plt
            server/_build/test/*.plt.hash
          key: dialyzer-${{ runner.os }}-otp28.4.2-elixir1.19.5-${{ hashFiles('server/mix.lock') }}
      - run: mix format --check-formatted && mix compile --warnings-as-errors && mix credo --strict && mix dialyzer && mix test
        working-directory: server
        env:
          MIX_ENV: test
      - name: Check OpenAPI snapshot
        working-directory: server
        env:
          MIX_ENV: test
        run: |
          mix run -e 'File.write!("/tmp/delivest-openapi.json", Jason.encode!(DelivestWeb.OpenApi.spec()))'
          diff -u <(jq -S . ../client/src/api/docs/swagger.json) <(jq -S . /tmp/delivest-openapi.json)
  agent:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: erlef/setup-beam@v1
        with:
          elixir-version: '1.19.5-otp-28'
          otp-version: '28.4.2'
      - uses: actions/cache@v4
        with:
          path: |
            agent/deps
            agent/_build/test
          key: ${{ runner.os }}-agent-mix-${{ hashFiles('agent/mix.lock') }}
      - run: mix deps.get
        working-directory: agent
      - run: mix format --check-formatted && mix compile --warnings-as-errors && mix test
        working-directory: agent
        env:
          MIX_ENV: test
  client:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: pnpm/action-setup@v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - run: pnpm install --frozen-lockfile && pnpm test:auth && pnpm test:regression && pnpm build && pnpm exec eslint .
        working-directory: client
      - name: Check generated API types
        working-directory: client
        run: pnpm schema:generate && pnpm exec prettier --write src/api/types.ts && git diff --exit-code -- src/api/types.ts
  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
      - name: Check load harness
        run: node --test scripts/load/*.test.mjs
      - name: Check clipboard hook
        run: node --experimental-default-type=module --test server/assets/js/hooks/copy_link.test.mjs
      - name: Check gitlinks
        run: |
          for name in server client agent; do
            test "$(git rev-parse "HEAD:$name")" = "$(git -C "$name" rev-parse HEAD)"
          done
      - name: Check shell and workflows
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r shellcheck
          find scripts -type f -name '*.sh' -print0 | xargs -0 -r -n1 bash -n
          shellcheck scripts/full-backup deploy/host-nginx.sh
          bash -n scripts/full-backup
          sh -n deploy/host-nginx.sh
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.10/actionlint_1.7.10_linux_amd64.tar.gz | tar -xz -C "$RUNNER_TEMP/actionlint" actionlint
          "$RUNNER_TEMP/actionlint/actionlint"
          ./scripts/test-release-images.sh
      - name: Check nginx configuration
        run: |
          docker run --rm --add-host server:127.0.0.1 --add-host client:127.0.0.1 --add-host s3:127.0.0.1 \
            -e PHX_HOST=api.example.test -e S3_PUBLIC_HOST=media.example.test \
            -e S3_BUCKET=media -e S3_PORT=9000 \
            -v "$PWD/deploy/nginx/gateway.conf.template:/etc/nginx/templates/default.conf.template:ro" nginx:stable-alpine nginx -t
          docker run --rm -v "$PWD/nginx.client.conf:/etc/nginx/conf.d/default.conf:ro" nginx:stable-alpine nginx -t
          ./scripts/test-nginx-log.sh
